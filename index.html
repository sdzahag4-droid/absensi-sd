<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi SD Zainul Hasan Genggong</title>
    <!-- Tailwind CSS untuk Desain -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library Pemindai Barcode/QR (Html5-Qrcode) -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white shadow-lg rounded-xl p-6 w-full max-w-md">
        <h1 class="text-xl font-bold text-center text-green-800 mb-1">SD ZAINUL HASAN GENGGONG</h1>
        <p class="text-sm text-center text-gray-500 mb-6">Sistem Absensi Barcode Santri</p>

        <!-- Area Kamera Scanner -->
        <div id="reader" class="w-full mb-4"></div>

        <!-- Form Input Manual (Alternatif jika scan gagal) -->
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Atau Masukkan ID Santri:</label>
            <div class="flex gap-2">
                <input type="text" id="id_santri" placeholder="Contoh: SDZHS-1A-001" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                <button onclick="prosesAbsen(document.getElementById('id_santri').value)" class="bg-green-700 hover:bg-green-800 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">Kirim</button>
            </div>
        </div>

        <!-- Notifikasi Status -->
        <div id="status-alert" class="hidden p-4 rounded-lg text-center font-semibold text-sm"></div>
    </div>

    <script>
        // GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyaPfHVf9bVRjsaPOZXeJUi5XBIZQJmmYbcGaylmhBJ8qL73X3klobpuiN4fo97WDIn/exec";

        function onScanSuccess(decodedText, decodedResult) {
            // Hentikan sementara scanner agar tidak scan beruntun
            html5QrcodeScanner.clear();
            prosesAbsen(decodedText);
        }

        function prosesAbsen(idSiswa) {
            if (!idSiswa) {
                tampilkanPesan("ID Santri tidak boleh kosong!", "error");
                return;
            }

            tampilkanPesan("Memproses data...", "info");

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors", // Diperlukan untuk Google Apps Script
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ action: "absan", id_siswa: idSiswa })
            })
            .then(() => {
                // Karena mode 'no-cors', respons dibaca sebagai sukses terkirim
                tampilkanPesan("Absen berhasil dikirim untuk ID: " + idSiswa, "success");
                document.getElementById('id_santri').value = "";
                
                // Nyalakan kembali scanner setelah 3 detik
                setTimeout(() => {
                    location.reload();
                }, 3000);
            })
            .catch(error => {
                console.error("Error:", error);
                tampilkanPesan("Terjadi kesalahan koneksi.", "error");
            });
        }

        function tampilkanPesan(pesan, tipe) {
            const alertBox = document.getElementById('status-alert');
            alertBox.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800', 'bg-yellow-100', 'text-yellow-800');
            
            if (tipe === "success") {
                alertBox.classList.add('bg-green-100', 'text-green-800');
            } else if (tipe === "error") {
                alertBox.classList.add('bg-red-100', 'text-red-800');
            } else {
                alertBox.classList.add('bg-yellow-100', 'text-yellow-800');
            }
            
            alertBox.innerText = pesan;
        }

        // Inisialisasi Kamera Barcode Scanner
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: 250 }, /* verbose=false */);
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
